spring.application.name=j_calculator
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5002,http://localhost:5001}

# Значение по умолчанию для фронтенда
frontend.url=${FRONTEND_URL:localhost}
frontend.port=${FRONTEND_PORT:5002}

# Значение по умолчанию для клиента базы данных
client.db.url=${CLIENT_DB_URL:localhost}
client.db.port=${CLIENT_DB_PORT:5001}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
# опционально access-лог Tomcat
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b
